server:
  port: 8090
spring:
 application:
  name: dentali-rest

 servlet:
   multipart:
     max-file-size: 5MB
     max-request-size: 6MB 

 # Conexión a PostgreSQL (contenedor dentali-db)
 datasource:
  url: jdbc:postgresql://localhost:5440/dentali
  username: dentali
  password: dentali_dev

 # Hibernate No crea tablas: solo verifica que coincidan con las entidades
 jpa:
  open-in-view: false
  hibernate:
    ddl-auto: validate
 
 data:
  web:
   pageable:
    max-page-size: 50

dentali:
 storage:
  ruta-base: ${user.home}/dentali-uploads